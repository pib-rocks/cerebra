version: "3"

networks:
    pib-network:
        name: pib-network
        driver: bridge
services:
    angular-app:
        image: ${PIB_CEREBRA_IMAGE:-ghcr.io/pib-rocks/cerebra}:${PIB_IMAGE_TAG:-develop}
        build:
            context: .
            dockerfile: Dockerfile
            args:
                NODE_ENV: production # or 'development' for dev build
                APP_VERSION: ${APP_VERSION:-v0.6.2}
        ports:
            - "80:80"
        networks:
            - pib-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: always
