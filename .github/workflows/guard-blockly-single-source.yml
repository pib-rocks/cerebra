name: Guard Blockly Single-Source

# Enforces PR-1477: the vendored pib-blockly tree (src/app/program/pib-blockly)
# is auto-generated from pib-backend and must NOT be edited directly in cerebra.
# Any PR that touches this path must originate from the sync bot (pib-sync-bot)
# on a sync/blockly-from-* branch. All other PRs touching it fail this check.

on:
  pull_request:
    paths:
      - "src/app/program/pib-blockly/**"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Verify change originates from the sync bot
        run: |
          ACTOR="${{ github.actor }}"
          HEAD_REF="${{ github.head_ref }}"
          echo "PR author:   $ACTOR"
          echo "Head branch: $HEAD_REF"

          # Allowed: the sync bot pushing a sync/blockly-from-* branch.
          if [ "$ACTOR" = "pib-sync-bot" ] && [[ "$HEAD_REF" == sync/blockly-from-* ]]; then
            echo "✅ Change comes from the Blockly sync bot — allowed."
            exit 0
          fi

          echo "::error::src/app/program/pib-blockly/ is auto-generated from pib-backend."
          echo "::error::Do NOT edit it here. Make your change in pib-rocks/pib-backend"
          echo "::error::(pib_blockly/pib_blockly_server/src/pib-blockly/); it will sync automatically."
          echo "::error::See Jira PR-1477 and the KB page 'Blockly Code: Single-Source Architecture & Sync'."
          exit 1
