<div class="program-editor h-100 w-100 p-3">
    <div
        class="program-toolbar d-flex flex-row-reverse hstack gap-3 position-absolute z-2 top-0 end-0 pt-4 pb-4 pe-5 pe-none"
        [style]="'transform: translate(' + -flyoutWidth + 'px, 0);'">
        <button
            id="export-btn"
            data-test="BTN_Program_Export"
            type="button"
            (click)="exportCode()"
            class="workspaceButton p-0">
            <img
                [src]="EXPORT"
                width="75px"
                alt="Program export button" />
        </button>
        <button
            id="code-btn"
            data-test="BTN_Program_Show_Code"
            type="button"
            (click)="showCode()"
            class="workspaceButton p-0">
            <img
                [src]="CODE"
                width="75px"
                alt="Show program code button" />
        </button>
        <button
            id="save-btn"
            data-test="BTN_Program_Save"
            type="button"
            (click)="saveCode()"
            [disabled]="codeVisualNew === codeVisualOld"
            class="workspaceButton p-0">
            <img
                [src]="codeVisualNew === codeVisualOld ? SAVE_INACTIVE : SAVE_ACTIVE"
                width="75px"
                alt="Program save button" />
        </button>
        <button
            id="run-btn"
            data-test="BTN_Program_Run_Stop"
            type="button"
            (click)="runProgram()"
            class="workspaceButton">
            <img
                [src]="executionState === ExecutionState.RUNNING ? STOP : PLAY"
                width="75px"
                alt="Program save button" />
        </button>
        <button
            id="toggle-btn"
            data-test="TGL_Split_Screen"
            type="button"
            class="workspaceButton"
            [attr.aria-pressed]="inSplitMode"
            title="Toggle the split view with the console"
            (click)="inSplitMode = !inSplitMode">
            <img
                [src]="inSplitMode ? SPLIT_ACTIVE : SPLIT_INACTIVE"
                width="75px"
                alt="Toggle between the block view and the split view with the console" />
        </button>
    </div>
    <as-split direction="vertical">
        <as-split-area
            [size]="50"
            [minSize]="15">
            <app-program-workspace
                [codeVisual]="codeVisualOld"
                (codePythonChange)="codePython = $event"
                (codeVisualChange)="codeVisualNew = $event"
                (trashcanFlyoutChange)="flyoutWidth = $event"></app-program-workspace>
        </as-split-area>
        @if (inSplitMode) {
        <as-split-area
            [size]="50"
            class="split-screen-lower">
            <app-console
                [programLogs$]="programLogs$"
                (programInput)="onProgramInputReceived($event)"
                [programState$]="programState$"></app-console>
        </as-split-area>
        }
    </as-split>
</div>
