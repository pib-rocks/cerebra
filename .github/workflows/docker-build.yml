name: Docker Build Pipeline

# Workflows triggered by `release` are read from the repository's default
# branch. This file only takes effect for published releases once it is on
# `main`. See docs/RELEASE.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.6.4)"
        required: true
        type: string

jobs:
  build-and-version:
    # No [skip ci] gate. A release event has no head_commit, so a check of
    # github.event.head_commit.message cannot see '[skip ci]'. Publishing the
    # release always builds.
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch all history for tags
        # Dispatch builds the requested tag. A published release already
        # checks out that tag (github.ref is refs/tags/<tag>). An empty
        # dispatch tag is falsy, so this falls through to github.ref and the
        # next step rejects the run instead of guessing a version.
        ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag) || github.ref }}

    - name: Resolve and validate the release tag
      id: get_tag
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        # The tag is the only source of truth: the published release supplies
        # it, or a manual run supplies inputs.tag. Never fall back to the
        # newest tag on HEAD^2 or HEAD. Two releases can point at the same
        # commit, and that guess republishes the older image while reporting
        # success.
        if [ "$EVENT_NAME" = "release" ]; then
          TAG="$RELEASE_TAG"
        else
          TAG="$INPUT_TAG"
        fi

        if [ -z "$TAG" ]; then
          echo "::error::No release tag provided."
          echo "::error::Publish a release, or run this workflow with the tag input set."
          echo "::error::See docs/RELEASE.md."
          exit 1
        fi

        if ! TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
          echo "::error::Tag ${TAG} does not exist in this repository."
          echo "::error::See docs/RELEASE.md."
          exit 1
        fi

        HEAD_COMMIT="$(git rev-parse HEAD)"
        if [ "$HEAD_COMMIT" != "$TAG_COMMIT" ]; then
          echo "::error::Checked-out commit ${HEAD_COMMIT} is not tag ${TAG} (${TAG_COMMIT})."
          echo "::error::Refusing to build an image from an unrelated tree."
          exit 1
        fi

        echo "Resolved release tag: ${TAG}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    # Release order is fixed: pib-backend is released FIRST, cerebra second.
    # cerebra is the consumer, so its build is the place that can verify the
    # backend release already exists. A cerebra image must never be published
    # against a backend version that was never released.
    - name: Require the same published release in pib-backend
      env:
        # Optional: a token with read access to pib-backend raises the API rate
        # limit from 60/h (unauthenticated) to 5000/h. Both repos are public,
        # so the guard also works without it.
        GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
      run: |
        TAG="${{ steps.get_tag.outputs.tag }}"
        API="https://api.github.com/repos/pib-rocks/pib-backend/releases/tags/${TAG}"

        if [ -n "${GH_TOKEN}" ]; then
          CODE=$(curl -sS -o /tmp/backend_release.json -w '%{http_code}' \
                   -H "Accept: application/vnd.github+json" \
                   -H "Authorization: Bearer ${GH_TOKEN}" "${API}")
        else
          CODE=$(curl -sS -o /tmp/backend_release.json -w '%{http_code}' \
                   -H "Accept: application/vnd.github+json" "${API}")
        fi

        if [ "${CODE}" = "404" ]; then
          echo "::error::pib-backend has no release ${TAG}."
          echo "::error::Release order is pib-backend FIRST, then cerebra."
          echo "::error::Publish ${TAG} in pib-rocks/pib-backend (on develop,"
          echo "::error::then merge develop -> main) before releasing cerebra."
          echo "::error::See docs/RELEASE.md."
          exit 1
        fi

        if [ "${CODE}" != "200" ]; then
          echo "::error::Could not verify the pib-backend release ${TAG}"
          echo "::error::(HTTP ${CODE}). Refusing to publish an image that may"
          echo "::error::not have a matching backend release."
          cat /tmp/backend_release.json
          exit 1
        fi

        # A draft release carries no git tag and is not a release.
        IS_DRAFT=$(python3 -c "import json;print(json.load(open('/tmp/backend_release.json'))['draft'])")
        if [ "${IS_DRAFT}" != "False" ]; then
          echo "::error::pib-backend release ${TAG} exists but is still a DRAFT."
          echo "::error::Publish it first - a draft creates no git tag."
          exit 1
        fi

        echo "Verified: pib-backend ${TAG} is published. Proceeding."

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Github repository ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # No `if:` guard needed - the run has already failed if there is no tag.
    # source must be the checkout. With no source, bake-action builds the Git
    # context https://github.com/<owner>/<repo>.git#<github.sha>. On
    # workflow_dispatch that SHA is the branch tip, not the tag this job
    # checked out and validated. A local path follows that checkout, which is
    # the tag on both the dispatch path and the release path.
    - name: Build and push Docker with tags
      uses: docker/bake-action@v7
      with:
        source: .
        push: true
        set: |
          *.platform=linux/arm64
          *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-cache:buildcache
          *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-cache:buildcache,mode=max
          *.tags=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          *.tags+=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.get_tag.outputs.tag }}
          *.args.APP_VERSION=${{ steps.get_tag.outputs.tag }}
