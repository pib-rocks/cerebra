<div
    class="startup-password"
    id="startup-password-panel">
    <div
        class="startup-password-title"
        id="startup-password-title">
        Operator password
    </div>
    <p class="startup-password-hint">
        Unlock the key store for Smart chat and Direct chat. Cancel leaves the
        robot in degraded mode.
    </p>
    <label
        class="startup-password-label"
        for="startup-password-input">
        Password
    </label>
    <input
        id="startup-password-input"
        type="password"
        autocomplete="current-password"
        [value]="password"
        (input)="onPasswordInput($event)" />
    @if (session.error) {
    <div
        class="alert alert-danger"
        id="startup-password-error">
        {{ session.error }}
    </div>
    }
    <div class="startup-password-actions">
        <button
            id="startup-password-ok"
            type="button"
            class="btn btn-outline-light"
            [disabled]="session.busy"
            (click)="ok()">
            OK
        </button>
        <button
            id="startup-password-cancel"
            type="button"
            class="btn btn-outline-light"
            (click)="cancel()">
            Cancel
        </button>
    </div>
</div>
