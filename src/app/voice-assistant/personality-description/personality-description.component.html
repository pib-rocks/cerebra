<div id="personality-description-editor">
    <label
        for="textarea-personality"
        class="soul-label">
        Identity
    </label>
    <p
        class="soul-hint"
        data-test="LBL_Identity_Hint">
        {{ identityHint() }}
    </p>
    @if (showMemoryNote()) {
    <p
        class="soul-hint"
        data-test="LBL_Memory_Smart_Only">
        MEMORY.md is part of the Smart channel only. It is not a second
        identity.
    </p>
    }
    <textarea
        id="textarea-personality"
        data-test="TXT_Peronality"
        class="form-control p-3 mb-4"
        rows="16"
        placeholder="The personality's identity"
        [value]="textAreaContent"
        (input)="onIdentityInput($event)"></textarea>
</div>
