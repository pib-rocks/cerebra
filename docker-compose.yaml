version: "3"

networks:
    pib-network:
        driver: bridge

services:
    angular-app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                NODE_ENV: production # or 'development' for dev build
                APP_VERSION: ${APP_VERSION:-v0.6.2}
        ports:
            - "80:80"
        networks:
            - pib-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: always
