<div class="col sidebar-right-wrapper h-100">
    <div class="row">
        <div class="mt-4">
            @for (sidebarElement of sidebarElements; track sidebarElement) {
            <div class="row">
                <div
                    class="col-11 element-div ms-sm-2 ms-xl-3 mt-3 text-nowrap"
                    routerLinkActive="element-div-active">
                    <div class="d-flex justify-content-between">
                        <a
                            [routerLink]="sidebarElement.getUUID()"
                            class="element text-truncate col-9 ps-sm-1 ps-xl-3 pe-2 pb-2 text-center-vertical"
                            [attr.data-test]="'BTN_' + sidebarElement.getName()">
                            {{ sidebarElement.getName() }}
                        </a>
                        <div ngbDropdown>
                            <button
                                type="button"
                                class="btn ps-sm-0"
                                data-test="DDN_sidebarElement.getName()"
                                id="dropdownbutton-{{sidebarElement.getName()}}"
                                title="Edit"
                                ngbDropdownToggle>
                                <i class="bi bi-three-dots dot-menu"></i>
                            </button>
                            <div
                                ngbDropdownMenu
                                attr.aria-labelledby="dropdownbutton-{{sidebarElement.getName()}}">
                                @for (callback of dropdownCallbackMethods; track
                                callback) {
                                <div>
                                    <button
                                        ngbDropdownItem
                                        [disabled]="callback.disabled"
                                        id="sidebar-right-{{toLowerCaseAndRemoveSpace(callback.label)}}-{{sidebarElement.getName()}}"
                                        data-test="DDN_sidebarElement.getName()"
                                        (click)="callback.clickCallback(sidebarElement.getUUID())">
                                        @if (callback.icon !== '') {
                                        <img
                                            [src]="callback.icon"
                                            class="item pe-1 mb-1" />
                                        }
                                        <label>{{callback.label}}</label>
                                    </button>
                                </div>
                                }
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            }
            <div class="row mt-4">
                <div class="col-11 ms-sm-2 ms-xl-3 p-0">
                    @for (option of optionCallbackMethods; track option) {
                    <div class="element-div option-row">
                        <button
                            type="button"
                            class="col btn ps-3 p-3 text-truncate element text-center"
                            id="sidebar-right-{{option.label}}"
                            [attr.data-test]="'BTN_' + option.label"
                            (click)="option.clickCallback('')">
                            <label class="mb-0">{{option.label}}</label>
                        </button>
                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
