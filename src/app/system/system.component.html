<div class="pt-4 pl-2 pr-2">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2">
        <ul class="nav nav-tabs mb-0">
            <li
                class="nav-item"
                routerLinkActive="navbar-btn-active">
                <a
                    id="hardware-nav"
                    data-test="LNK_Hardware_IDs"
                    class="nav-link sidebar-btn"
                    routerLink="hardware-ids">
                    Hardware IDs
                </a>
            </li>
            <li
                class="nav-item"
                routerLinkActive="navbar-btn-active">
                <a
                    id="docker-nav"
                    data-test="LNK_Docker"
                    class="nav-link sidebar-btn"
                    routerLink="docker">
                    Docker
                </a>
            </li>
            <li
                class="nav-item"
                routerLinkActive="navbar-btn-active">
                <a
                    id="host-info-nav"
                    data-test="LNK_System_Info"
                    class="nav-link sidebar-btn"
                    routerLink="host-info">
                    System Info
                </a>
            </li>
            <li
                class="nav-item"
                routerLinkActive="navbar-btn-active">
                <a
                    id="bricklets-nav"
                    data-test="LNK_Bricklets"
                    class="nav-link sidebar-btn"
                    routerLink="bricklets">
                    Bricklets
                </a>
            </li>
        </ul>
        <button
            type="button"
            class="btn btn-regular diagnostics-button mb-2"
            data-test="BTN_Download_Diagnostics"
            [disabled]="downloadingDiagnostics"
            (click)="downloadDiagnostics()">
            {{
                downloadingDiagnostics
                    ? "Generating…"
                    : "Download diagnostics ZIP"
            }}
        </button>
    </div>
    <div class="mt-3">
        <div class="background-image">
            <div class="pink-corner-frame p-3">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
