<div
    class="wrapper"
    [class.display-path]="onDisplayPath"
    [class.sidebar-collapse]="sidebarCollapsed">
    @if (!onDisplayPath) {
    <div class="sidebar-wrapper">
        <aside class="main-sidebar elevation-4 sidebar d-flex flex-column">
            <div class="d-flex flex-column align-items-center">
                <a class="brand-link">
                    <img
                        src="../assets/pib-Logo.png"
                        data-test="IMG_Cerebra_Logo"
                        routerLink="head"
                        alt="cerebra logo"
                        class="img-fluid d-inline-block"
                        style="cursor: pointer"
                        title="Cerebra" />
                </a>
                <div
                    class="version-footer"
                    data-test="TXT_AppVersion">
                    {{ appVersion }}
                </div>
                <div class="sidebar nav-below-brand">
                    <nav class="mt-12">
                        <ul
                            class="nav nav-pills nav-sidebar flex-column"
                            role="menu"
                            routerLinkActive="show">
                            <li
                                class="nav-item"
                                role="presentation">
                                <a
                                    class="nav-link sidebar-btn"
                                    id="movement-nav"
                                    data-test="LNK_Movement"
                                    [class.btn-active]="isActiveRoute"
                                    [routerLink]="['/movement', '3d']">
                                    <svg
                                        class="me-1"
                                        xmlns="http://www.w3.org/2000/svg"
                                        height="20px"
                                        viewBox="0 0 24 24"
                                        width="20px">
                                        <path
                                            d="M17 16l-4-4V8.82c1.35-.49 2.26-1.89 1.93-3.46-.25-1.18-1.23-2.12-2.42-2.32C10.63 2.73 9 4.17 9 6c0 1.3.84 2.4 2 2.82V12l-4 4H4c-.55 0-1 .45-1 1v3c0 .55.45 1 1 1h3c.55 0 1-.45 1-1v-2.05l4-4.2 4 4.2V20c0 .55.45 1 1 1h3c.55 0 1-.45 1-1v-3c0-.55-.45-1-1-1h-3z" />
                                    </svg>
                                    Movement
                                </a>
                            </li>
                            <li
                                class="nav-item"
                                role="presentation">
                                <a
                                    id="vision-nav"
                                    data-test="LNK_Vision"
                                    class="nav-link sidebar-btn"
                                    routerLinkActive="btn-active"
                                    routerLink="vision">
                                    <svg
                                        class="me-1"
                                        width="20px"
                                        height="20px"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M4 6H16C16.55 6 17 6.45 17 7V10.5L21 6.5V17.5L17 13.5V17C17 17.55 16.55 18 16 18H4C3.45 18 3 17.55 3 17V7C3 6.45 3.45 6 4 6Z" />
                                    </svg>
                                    Vision
                                </a>
                            </li>
                            <li
                                class="nav-item"
                                role="presentation">
                                <a
                                    id="voice-assistant-nav"
                                    data-test="LNK_Voice_Assistant"
                                    class="nav-link sidebar-btn"
                                    routerLinkActive="btn-active"
                                    routerLink="voice-assistant">
                                    <svg
                                        class="me-1"
                                        width="20px"
                                        height="20px"
                                        viewBox="0 0 48 48"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <defs></defs>
                                        <circle
                                            class="a"
                                            cx="14.3548"
                                            cy="19.496"
                                            r="4.934" />
                                        <path
                                            class="a"
                                            d="M24.7339,33.2758v1.6906a1.641,1.641,0,0,1-1.6447,1.6446H6.1447A1.641,1.641,0,0,1,4.5,34.9664V33.2758c2.1586-7.0207,18.973-5.8163,20.2339,0Z" />
                                        <path
                                            class="a"
                                            d="M25.258,20.877v5.0323" />
                                        <path
                                            class="a"
                                            d="M29.8186,16.2116V30.5745" />
                                        <path
                                            class="a"
                                            d="M34.3791,11.3891V35.3972" />
                                        <path
                                            class="a"
                                            d="M43.5,20.877v5.0323" />
                                        <path
                                            class="a"
                                            d="M38.94,16.2116V30.5745" />
                                    </svg>
                                    Voice Assistant
                                </a>
                            </li>
                            <li
                                class="nav-item"
                                role="presentation">
                                <a
                                    id="program-nav"
                                    data-test="LNK_Program"
                                    class="nav-link sidebar-btn"
                                    routerLinkActive="btn-active"
                                    routerLink="program">
                                    <svg
                                        class="me-1"
                                        xmlns="http://www.w3.org/2000/svg"
                                        height="20px"
                                        viewBox="0 0 24 24"
                                        width="20px">
                                        <path
                                            d="M8.7 15.9L4.8 12l3.9-3.9c.39-.39.39-1.01 0-1.4-.39-.39-1.01-.39-1.4 0l-4.59 4.59c-.39.39-.39 1.02 0 1.41l4.59 4.6c.39.39 1.01.39 1.4 0 .39-.39.39-1.01 0-1.4zm6.6 0l3.9-3.9-3.9-3.9c-.39-.39-.39-1.01 0-1.4.39-.39 1.01-.39 1.4 0l4.59 4.59c.39.39.39 1.02 0 1.41l-4.59 4.6c-.39.39-1.01.39-1.4 0-.39-.39-.39-1.01 0-1.4z" />
                                    </svg>
                                    Program
                                </a>
                            </li>
                            <li
                                class="nav-item"
                                role="presentation">
                                <a
                                    id="smart-home-nav"
                                    data-test="LNK_Smart_Home"
                                    class="nav-link sidebar-btn"
                                    routerLinkActive="btn-active"
                                    routerLink="smart-home">
                                    <svg
                                        class="me-1"
                                        aria-hidden="true"
                                        xmlns="http://www.w3.org/2000/svg"
                                        height="20px"
                                        viewBox="0 0 24 24"
                                        width="20px">
                                        <path
                                            d="M12 3L4 9v12h5v-7h6v7h5V9l-8-6zm0 2.69l6 4.5V19h-1v-7H7v7H6v-8.81l6-4.5z" />
                                    </svg>
                                    SmartHome
                                </a>
                            </li>
                            <li
                                class="nav-item"
                                role="presentation">
                                <a
                                    id="system-nav"
                                    data-test="LNK_System"
                                    class="nav-link sidebar-btn"
                                    routerLinkActive="btn-active"
                                    routerLink="system">
                                    <svg
                                        class="me-1"
                                        xmlns="http://www.w3.org/2000/svg"
                                        height="20px"
                                        viewBox="0 0 24 24"
                                        width="20px">
                                        <path
                                            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                                    </svg>
                                    System
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
            <div class="sidebar-status d-flex flex-column align-items-center">
                <app-relay-control></app-relay-control>
                <app-smart-connect></app-smart-connect>
                <app-ip-retriever></app-ip-retriever>
            </div>
        </aside>
    </div>
    <button
        id="sidebar-toggle-button"
        data-test="BTN_SidebarToggle"
        type="button"
        class="sidebar-toggle"
        [attr.aria-expanded]="isNavigationVisible()"
        [attr.aria-label]="
            isNavigationVisible() ? 'Hide navigation' : 'Show navigation'
        "
        [title]="isNavigationVisible() ? 'Hide navigation' : 'Show navigation'"
        (click)="toggleSidebar()">
        <i
            class="bi"
            [class.bi-chevron-left]="isNavigationVisible()"
            [class.bi-chevron-right]="!isNavigationVisible()"></i>
    </button>
    }
    <div class="content-wrapper">
        <div class="container-fluid">
            <div class="d-flex flex-row">
                <div class="flex-shrink-1 flex-grow-1 overflow-hidden">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
    </div>
    @if (showStartupPassword()) {
    <div
        id="startup-password-modal"
        class="modal d-block cerebra-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="startup-password-title">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <app-startup-password></app-startup-password>
            </div>
        </div>
    </div>
    <div
        id="startup-password-backdrop"
        class="modal-backdrop fade show cerebra-modal-backdrop"></div>
    }
</div>
