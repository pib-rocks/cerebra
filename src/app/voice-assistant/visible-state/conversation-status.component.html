<div
    class="conversation-state"
    [class.assistant]="surface === 'assistant'"
    [id]="surface === 'display' ? 'display-conversation-state' : 'assistant-conversation-state'">
    @if (surface === "display") {
    <app-animated-face
        [activity]="state.activity"
        [mouthOpen]="state.mouthOpen"></app-animated-face>
    }
    <p
        [id]="surface === 'display' ? 'display-voice-holder' : 'assistant-voice-holder'">
        {{ state.holderLine }}
    </p>
    @if (state.activity !== idle) {
    <p
        class="activity"
        [id]="surface === 'display' ? 'display-conversation-activity' : 'assistant-conversation-activity'"
        [attr.data-activity]="state.activity">
        {{ state.activityLabel }}
    </p>
    } @if (state.degraded) {
    <p
        [id]="surface === 'display' ? 'display-conversation-degraded' : 'assistant-conversation-degraded'">
        Degraded
    </p>
    } @if (state.fallback) {
    <p
        [id]="surface === 'display' ? 'display-conversation-fallback' : 'assistant-conversation-fallback'">
        Fallback
    </p>
    }
</div>
