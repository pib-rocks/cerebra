name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🧪 Testing'
    labels:
      - 'testing'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '🔧 Refactoring & Maintenance'
    labels:
      - 'refactor'
      - 'maintenance'
      - 'dependencies'
exclude-labels:
  - 'duplicate'
  - 'wontfix'
  - 'question'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'fix'
      - 'testing'
      - 'documentation'
      - 'refactor'
      - 'maintenance'
      - 'dependencies'
  default: patch
template: |
  ## What's Changed

  $CHANGES
