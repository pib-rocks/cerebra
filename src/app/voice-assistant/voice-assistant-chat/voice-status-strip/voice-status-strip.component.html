<div
    class="voice-status"
    data-test="VOICE_STATUS_STRIP">
    <span
        class="voice-status-chip"
        [class.voice-status-chip-active]="status.mic === 'listening'"
        [class.voice-status-chip-muted]="status.mic === 'off'"
        data-test="VOICE_STATUS_MIC">
        {{ micLabel }}
    </span>
    <span
        class="voice-status-chip"
        data-test="VOICE_STATUS_PHASE">
        {{ phaseLabel }}
    </span>
    @if (showProviderChip) {
    <span
        class="voice-status-chip voice-status-provider"
        [ngClass]="providerStateClass"
        [title]="providerTooltip"
        data-test="VOICE_STATUS_PROVIDER">
        <span
            class="provider-health-dot"
            aria-hidden="true"></span>
        <span class="provider-health-name">{{ providerName }}</span>
        · {{ providerStateLabel }}
        <button
            type="button"
            class="provider-health-refresh"
            data-test="BTN_PROVIDER_HEALTH_REFRESH"
            [disabled]="providerLoading"
            aria-label="Check the provider again"
            title="Check the provider again"
            (click)="requestProviderRefresh()">
            ⟳
        </button>
    </span>
    } @if (status.source) {
    <span
        class="voice-status-chip"
        data-test="VOICE_STATUS_SOURCE">
        {{ status.source }}@if (status.model) {<span class="voice-status-model">
            · {{ status.model }}</span
        >}
    </span>
    } @if (lastStageLabel) {
    <span
        class="voice-status-chip"
        data-test="VOICE_STATUS_STAGE">
        {{ lastStageLabel }}
    </span>
    }
</div>
