<div class="row mt-4">
    <div class="row pink-corner-frame w-100">
        <div class="main col-sm-9 col-xl-10">
            <div class="row pt-2 mt-2">
                <div class="col-6 text-right">
                    <span class="align-middle"> Chats </span>
                </div>
                <div class="col-auto pr-0 pl-0">
                    <a
                        class="toggle-button"
                        id="personality-description-toggle-voice-assistant"
                        data-test="TGL_Chat"
                        [routerLink]="['chat']">
                        <img
                            [src]="'../../assets/toggle-switch-right.png'"
                            alt="Toggle for turning back to chats" />
                    </a>
                </div>
                <div class="col text-left">
                    <span class="align-middle">Personality</span>
                </div>
            </div>
            <div class="row mt-3 content-window">
                <div class="col">
                    <label
                        for="textarea-personality"
                        class="soul-label">
                        Identity
                    </label>
                    <p
                        class="soul-hint"
                        data-test="LBL_Identity_Hint">
                        {{ identityHint() }}
                    </p>
                    @if (showMemoryNote()) {
                    <p
                        class="soul-hint"
                        data-test="LBL_Memory_Smart_Only">
                        MEMORY.md is part of the Smart channel only. It is not a
                        second identity.
                    </p>
                    }
                    <textarea
                        id="textarea-personality"
                        data-test="TXT_Peronality"
                        class="form-control p-3 mb-4"
                        rows="16"
                        placeholder="The personality's identity"
                        [(ngModel)]="textAreaContent"
                        (input)="updateDescription()"></textarea>
                </div>
            </div>
        </div>
        <div class="col-sm-3 col-xl-2 p-0">
            <app-va-personality-sidebar-right class="m-0">
            </app-va-personality-sidebar-right>
        </div>
    </div>
</div>
