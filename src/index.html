<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cerebra</title>
        <script>
            (() => {
                const query = new URLSearchParams(window.location.search);
                const viewAllParameter = query.get("viewall");

                if (viewAllParameter === "true") {
                    document.cookie =
                        "viewall=true; Path=/; Max-Age=31536000; SameSite=Lax";
                } else if (viewAllParameter === "false") {
                    document.cookie =
                        "viewall=; Path=/; Max-Age=0; SameSite=Lax";
                }

                const hasViewAllCookie = document.cookie
                    .split(";")
                    .map((cookie) => cookie.trim())
                    .includes("viewall=true");
                const showFullView =
                    viewAllParameter === "true" ||
                    (viewAllParameter !== "false" && hasViewAllCookie);

                document.documentElement.classList.toggle(
                    "view-all",
                    showFullView,
                );

                const enforceJointControlRoute = () => {
                    const isJointControlRoute =
                        window.location.pathname === "/" ||
                        window.location.pathname.startsWith("/joint-control");

                    if (!isJointControlRoute) {
                        window.location.replace("/joint-control/head");
                    }
                };

                if (!showFullView) {
                    enforceJointControlRoute();
                    window.addEventListener(
                        "popstate",
                        enforceJointControlRoute,
                    );
                }
            })();
        </script>
        <style>
            html:not(.view-all) .sidebar-wrapper,
            html:not(.view-all) #hamburger-button {
                display: none !important;
            }

            html:not(.view-all) .content-wrapper {
                margin-left: 0 !important;
            }
        </style>
        <base href="/" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1" />
        <link
            rel="icon"
            type="image/x-icon"
            href="assets/cerebra-favicon.png" />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
            crossorigin="anonymous"></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" />
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
