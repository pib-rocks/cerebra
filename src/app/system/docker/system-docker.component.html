<div class="system-panel">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-headline">Docker containers</div>
        <button
            type="button"
            class="btn btn-regular hardware-button"
            data-test="BTN_Refresh_Containers"
            (click)="refresh()"
            [disabled]="loading">
            Refresh
        </button>
    </div>

    <div
        *ngIf="error"
        class="validation-error mb-3">
        {{ error }}
    </div>

    <div
        *ngIf="loading"
        class="form-content">
        Loading containers…
    </div>

    <div
        *ngIf="!loading && !error"
        class="container-list">
        <button
            type="button"
            class="container-row"
            *ngFor="let container of containers"
            [class.selected]="selectedContainer?.name === container.name"
            [attr.data-test]="'BTN_Container_' + container.name"
            (click)="selectContainer(container)">
            <span
                class="health-dot"
                [class.healthy]="isHealthy(container)"
                [class.unhealthy]="!isHealthy(container)"></span>
            <span class="container-name">{{ container.name }}</span>
            <span class="container-meta">{{ container.image }}</span>
            <span
                class="health-label"
                [class.healthy]="isHealthy(container)"
                [class.unhealthy]="!isHealthy(container)">
                {{ container.health }}
            </span>
            <span class="container-status">{{ container.status }}</span>
        </button>

        <div
            *ngIf="containers.length === 0"
            class="form-content">
            No containers found.
        </div>
    </div>

    <div
        *ngIf="selectedContainer"
        class="logs-panel mt-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="form-content">
                Logs: {{ selectedContainer.name }}
            </div>
            <button
                type="button"
                class="btn btn-regular hardware-button"
                (click)="closeLogs()">
                Close
            </button>
        </div>
        <pre
            class="logs-output"
            data-test="TXT_Container_Logs">{{ loadingLogs ? 'Loading logs…' : logs }}</pre>
    </div>
</div>
